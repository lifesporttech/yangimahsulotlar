<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yangi kelgan mahsulotlar</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#6b7280;--card:#f3f4f6;--acc:#2563eb;--line:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#111827;--fg:#f3f4f6;--mut:#9ca3af;--card:#1f2937;--acc:#60a5fa;--line:#374151}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px}
.w{max-width:640px;margin:0 auto;padding:0 12px 24px}
.top{position:sticky;top:0;background:var(--bg);padding:10px 0 8px;z-index:5;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0 0 8px}
input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:var(--card);color:var(--fg);outline:none}
.row{display:flex;gap:8px;margin-top:8px}
.btn{flex:1;min-height:44px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;font-size:14px;cursor:pointer;padding:0 8px}
.btn.on{background:var(--acc);border-color:var(--acc);color:#fff}
.bw{display:none;margin-top:8px;max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:12px}
.bw.open{display:block}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:12px;border-bottom:1px solid var(--line);text-align:left}
th{background:var(--card);position:sticky;top:0}
td:last-child,th:last-child{text-align:right;width:70px}
tr.b.sel td{background:var(--acc);color:#fff}
.cnt{color:var(--mut);font-size:13px;margin:10px 2px 2px}
.it{display:flex;justify-content:space-between;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);font-size:15px;line-height:1.3}
.it span:last-child{white-space:nowrap;font-weight:600}
.no{text-align:center;color:var(--mut);padding:30px}

<button class="btn" data-s="az">A-Z</button>

<div class="bw" id="bw"><table><thead><tr><th>Brend</th><th>Soni</th></tr></thead><tbody id="brands"></tbody></table></div>

const $=id=>document.getElementById(id);
const fmt=n=>n.toLocaleString("en-US").replace(/,/g," ");
function brandsUI(){
  const c={};DATA.forEach(r=>c[r.b]=(c[r.b]||0)+1);
  const list=Object.entries(c).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
  $("brands").innerHTML=`<tr class="b ${brand?"":"sel"}" data-b=""><td>Hammasi</td><td>${DATA.length}</td></tr>`+
    list.map(([b,n])=>`<tr class="b ${brand===b?"sel":""}" data-b="${b}"><td>${b}</td><td>${n}</td></tr>`).join("");
  document.querySelectorAll("tr.b").forEach(el=>el.onclick=()=>{brand=el.dataset.b;$("bw").classList.remove("open");$("bb").textContent=(brand||"Brend")+" ▾";$("bb").classList.toggle("on",!!brand);brandsUI();render()});
}
function render(){
  const q=$("q").value.trim().toLowerCase();
  const res=DATA.filter(r=>(!brand||r.b===brand)&&(!q||r.n.toLowerCase().includes(q)));
  res.sort((a,b)=>sort==="pa"?a.p-b.p||a.n.localeCompare(b.n):sort==="pd"?b.p-a.p||a.n.localeCompare(b.n):a.n.localeCompare(b.n));
